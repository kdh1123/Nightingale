[package]
name = "nightingale"
version = "0.1.0"
description = "A defensive cross-platform security monitor"
authors = ["Nightingale contributors"]
license = "MIT"
homepage = "https://github.com/kdh1123/Nightingale"
repository = "https://github.com/kdh1123/Nightingale"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nightingale_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[dependencies]
directories = "6.0.0"
notify = "8"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
sysinfo = "0.39"
tauri = { version = "2.9.5", features = [] }
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
